[package]
name = "rigbyfy"
version = "0.1.0"
description = "Player local e offline"
authors = ["Rigbyfy"]
edition = "2021"

[lib]
name = "rigbyfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["app"]
app = ["dep:tauri", "dep:tauri-plugin-media-source", "dep:tauri-plugin-media-player", "dep:tauri-plugin-media-downloader"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-media-source = { path = "../plugins/media-source", optional = true }
tauri-plugin-media-player = { path = "../plugins/media-player", optional = true }
tauri-plugin-media-downloader = { path = "../plugins/media-downloader", optional = true }
thiserror = "2"
url = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
