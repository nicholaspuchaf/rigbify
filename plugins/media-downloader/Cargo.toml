[package]
name = "tauri-plugin-media-downloader"
version = "0.1.0"
authors = ["Rigbyfy"]
description = "Downloads de mídia permitida com yt-dlp no Android"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-media-downloader"

[dependencies]
tauri = { version = "2.11.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

